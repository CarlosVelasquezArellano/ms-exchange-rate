quarkus.http.port=8083

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=admin
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ms-exchange-rate

quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.rest-client.tipo-cambio-proxy.url=https://free.e-api.net.pe
quarkus.rest-client.tipo-cambio-proxy.connect-timeout=5000
quarkus.rest-client.tipo-cambio-proxy.read-time=5000

quarkus.tls.exchange-rate.trust-all=true
quarkus.rest-client.tipo-cambio-proxy.tls-configuration-name=exchange-rate
